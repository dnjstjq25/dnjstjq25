name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "40 18 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate green contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232E7D32&color_dots=%23ebedf0,%23c8e6c9,%2381c784,%2343a047,%231b5e20
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2366bb6a&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Publish SVG files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
